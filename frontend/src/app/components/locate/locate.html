<div class="locate-section">
  <h2>Locate Point</h2>

  <div class="coordinates">
    <div class="field">
      <label for="x">X</label>
      <input id="x" type="number" [(ngModel)]="x" placeholder="e.g. 15" />
    </div>
    <div class="field">
      <label for="y">Y</label>
      <input id="y" type="number" [(ngModel)]="y" placeholder="e.g. 15" />
    </div>
    <div class="field">
      <label for="z">Z</label>
      <input id="z" type="number" [(ngModel)]="z" placeholder="e.g. 1" />
    </div>
    <button (click)="locate()" [disabled]="x === null || y === null || z === null || loading">
      {{ loading ? 'Locating...' : 'Locate' }}
    </button>
  </div>

  <div *ngIf="error" class="error">{{ error }}</div>

  <div *ngIf="result" class="result">
    <div *ngIf="result.building; else notFound">
      <p><strong>Building:</strong> {{ result.building }}</p>
      <p *ngIf="result.floor"><strong>Floor:</strong> {{ result.floor }}</p>
      <p *ngIf="!result.floor" class="warning">Inside building but not on any floor</p>
    </div>
    <ng-template #notFound>
      <p class="not-found">Point is not inside any known building</p>
    </ng-template>
  </div>
</div>
